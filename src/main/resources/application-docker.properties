server.port=8080

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.config.use-legacy-processing=true
spring.profiles.active=docker

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Enable all Actuator endpoints
management.endpoints.web.exposure.include=*

# Enable detailed health information
management.endpoint.health.show-details=ALWAYS

# Enable info information
management.info.env.enabled = true

# Enable specific Actuator endpoints
management.endpoint.info.enabled=true
management.endpoint.beans.enabled=true

info.app.name=Spring Boot Unit testing application
info.app.version=0.0.1-SNAPSHOT
info.app.description=This project demonstrates Spring Boot unit testing integrated with Jenkins deployment and code coverage analysis.
